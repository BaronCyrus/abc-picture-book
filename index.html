<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#bfe4f7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ABC" />
    <meta name="description" content="A moving alphabet picture book for little ones. 会动的字母绘本。" />
    <title>ABC Picture Book · 会动的字母绘本</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23E9523C'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial Rounded MT Bold,Arial,sans-serif' font-weight='700' text-anchor='middle' fill='white'%3EA%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* shown instantly, before any script has arrived (slow networks) */
      html, body { margin: 0; height: 100%; background: #cfeaf9; }
      #boot { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; gap: 14px; background: #cfeaf9; }
      #boot i { width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 4px 0 rgba(52, 40, 86, 0.18); animation: boot-hop 0.7s ease-in-out infinite; }
      #boot i:nth-child(1) { background: #e9523c; }
      #boot i:nth-child(2) { background: #f4b81f; animation-delay: 0.12s; }
      #boot i:nth-child(3) { background: #3f93d6; animation-delay: 0.24s; }
      @keyframes boot-hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><i></i><i></i><i></i></div>
    <canvas id="gl" aria-hidden="true"></canvas>
    <main id="app"></main>
    <svg id="wipe" aria-hidden="true"><path fill-rule="evenodd" /></svg>
    <noscript>This picture book needs JavaScript.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
